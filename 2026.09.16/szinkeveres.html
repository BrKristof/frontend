<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB színkeverés</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <table>
        <tbody>
            <tr>
                <td>Piros:</td>
                <td><input type="range" id="red-range" min="0" max="255" value="0"></td>
                <td><input type="number" id="red-value" min="0" max="255" value="0"></td>
            </tr>
            <tr>
                <td>Zöld: </td>
                <td><input type="range" id="green-range" min="0" max="255" value="0" ></td>
                <td><input type="number" id="green-value" min="0" max="255" value="0"></td>
            </tr>
            <tr>
                <td>Kék: </td>
                <td><input type="range" id="blue-range" min="0" max="255" value="0" ></td>
                <td><input type="number" id="blue-value" min="0" max="255" value="0"></td>
            </tr>
            <tr>
                <td>Átlátszóság</td>
                <td><input type="range" id="alpha-range" min="0" max="1" value="1" step="0.01"></td>
                <td><input type="number" id="alpha-value" min="0" max="1" value="1" step="0.01"></td>
            </tr>
        </tbody>
    </table>

    <table>
        <tr>
            <td>Szélesség</td>
            <td><input type="range" id="box-width" min="0" max="600" value="0"></td>
            <td><input type="number" id="width-num" min="0" max="600" value="0"></td>
        </tr>
        <tr>
            <td>Magasság</td>
            <td><input type="range" id="box-height" min="0" max="400" value="0"></td>
            <td><input type="number" id="height-num" min="0" max="400" value="0"></td>
        </tr>
        <tr>
            <td>Lekerekítés</td>
            <td><input type="range" id="box-border-radius" min="0" max="300" value="0"></td>
            <td><input type="number" id="radius-num" min="0" max="300" value="0"></td>
        </tr>
        <tr>
            <td>Felső margó</td>
            <td><input type="range" id="box-margin-top" min="-1000" max="1000" value="0" step="10"></td>
            <td><input type="number" id="marginT-num" min="-1000" max="1000" value="0" step="10"></td>
        </tr>
        <tr>
            <td>Bal margó</td>
            <td><input type="range" id="box-margin-left" min="-1000" max="1000" value="0" step="10"></td>
            <td><input type="number" id="marginL-num" min="-1000" max="1000" value="0" step="10"></td>
        </tr>
        
    </table>
    <div id="rgb-box"></div>

    <script src="./functions.js"></script>
</body>
</html>
